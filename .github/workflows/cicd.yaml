                sudo cp '$TOMCAT_WEBAPPS/$APP_NAME.war.backup' '$TOMCAT_WEBAPPS/$APP_NAME.war'
              fi
              exit 1
            fi
            sudo systemctl start '$TOMCAT_SERVICE'
            rm -f /tmp/$APP_NAME.war
          "

      - name: Health Check
        run: curl -f ${{ env.APP_URL }} || (echo "Health check failed" && exit 1)

