name: Multi Environment CI-CD Pipeline for train-ticket-reservation

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment to deploy'
        required: true
        type: choice
        options:
          - DEV
          - TEST
          - PRE-PROD
          - PROD

env:
  APP_NAME: train-ticket-reservation

jobs:
  build:
    name: Build WAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build WAR
        run: mvn clean package

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: application-war
          path: target/*.war

  deploy-dev:
    name: Deploy DEV
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'DEV' || github.ref == 'refs/heads/dev'
    environment:
      name: dev
    env:
      TOMCAT_HOST: ${{ vars.DEV_TOMCAT_HOST }}
      TOMCAT_USER: ${{ vars.DEV_TOMCAT_USER }}
      TOMCAT_WEBAPPS: ${{ vars.DEV_TOMCAT_WEBAPPS }}
      TOMCAT_SERVICE: ${{ vars.DEV_TOMCAT_SERVICE }}
      APP_URL: ${{ vars.DEV_APP_URL }}
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Copy WAR to DEV
        run: scp -i ~/.ssh/id_rsa ./artifact/*.war "$TOMCAT_USER@$TOMCAT_HOST:/tmp/$APP_NAME.war"

      - name: Deploy DEV with Rollback
        run: |
          ssh -i ~/.ssh/id_rsa "$TOMCAT_USER@$TOMCAT_HOST" "
            set -e
            sudo systemctl stop '$TOMCAT_SERVICE' || true
            if [ -f '$TOMCAT_WEBAPPS/$APP_NAME.war' ]; then
              sudo cp '$TOMCAT_WEBAPPS/$APP_NAME.war' '$TOMCAT_WEBAPPS/$APP_NAME.war.backup'
            fi
            if sudo install -m 0644 /tmp/$APP_NAME.war '$TOMCAT_WEBAPPS/$APP_NAME.war'; then
              echo 'Deployment succeeded'
            else
              echo 'Deployment failed, rolling back...'
              if [ -f '$TOMCAT_WEBAPPS/$APP_NAME.war.backup' ]; then
                sudo cp '$TOMCAT_WEBAPPS/$APP_NAME.war.backup' '$TOMCAT_WEBAPPS/$APP_NAME.war'
              fi
              exit 1
            fi
            sudo systemctl start '$TOMCAT_SERVICE'
            rm -f /tmp/$APP_NAME.war
          "

      - name: Health Check
        run: curl -f ${{ env.APP_URL }} || (echo "Health check failed" && exit 1)

  deploy-test:
    name: Deploy TEST
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'TEST' || github.ref == 'refs/heads/test'
    environment:
      name: test
    env:
      TOMCAT_HOST: ${{ vars.TEST_TOMCAT_HOST }}
      TOMCAT_USER: ${{ vars.TEST_TOMCAT_USER }}
      TOMCAT_WEBAPPS: ${{ vars.TEST_TOMCAT_WEBAPPS }}
      TOMCAT_SERVICE: ${{ vars.TEST_TOMCAT_SERVICE }}
      APP_URL: ${{ vars.TEST_APP_URL }}
    steps:
      - name: Download WAR
