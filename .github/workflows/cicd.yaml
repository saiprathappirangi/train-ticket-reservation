name: CI/CD Pipeline

on:
  push:
    branches:
      - main   # deploy only when code is pushed to main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Build WAR with Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Upload artifact for deployment
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: train-ticket-reservation
          path: target/train-ticket-reservation.war

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment: DEV   # change to TEST, PREPROD, PROD when deploying

    steps:
      # 1. Download WAR artifact
      - name: Download WAR artifact
        uses: actions/download-artifact@v3
        with:
          name: train-ticket-reservation

      # 2. Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.DEV_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # 3. Copy WAR to Tomcat
      - name: Deploy WAR to Tomcat
        run: |
          scp -i ~/.ssh/id_rsa train-ticket-reservation.war \
            ${{ vars.DEV_TOMCAT_USER }}@${{ vars.DEV_TOMCAT_HOST }}:${{ vars.DEV_TOMCAT_WEBAPPS }}/

      # 4. Restart Tomcat
      - name: Restart Tomcat
        run: |
          ssh -i ~/.ssh/id_rsa ${{ vars.DEV_TOMCAT_USER }}@${{ vars.DEV_TOMCAT_HOST }} \
            "sudo systemctl restart ${{ vars.DEV_TOMCAT_SERVICE }}"

      # 5. Health check
      - name: Verify deployment
        run: |
          curl -f ${{ vars.DEV_APP_URL }}
