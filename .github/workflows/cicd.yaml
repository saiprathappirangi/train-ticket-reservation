name: Multi Environment CI-CD Pipeline for train-ticket-reservation

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build WAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maven Build
        run: mvn clean package

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: application-war
          path: target/*.war
  deploy-dev:
    name: Deploy DEV
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'DEV' || github.ref == 'refs/heads/dev'
    environment:
      name: dev
    env:
      TOMCAT_HOST: ${{ vars.DEV_TOMCAT_HOST }}
      TOMCAT_USER: ${{ vars.DEV_TOMCAT_USER }}
      TOMCAT_WEBAPPS: ${{ vars.DEV_TOMCAT_WEBAPPS }}
      TOMCAT_SERVICE: ${{ vars.DEV_TOMCAT_SERVICE }}
      APP_URL: ${{ vars.DEV_APP_URL }}
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
      - name: Copy WAR to DEV
        run: scp -i ~/.ssh/id_rsa ./artifact/*.war "$TOMCAT_USER@$TOMCAT_HOST:/tmp/$APP_NAME.war"
      - name: Deploy DEV
        run: |
          ssh -i ~/.ssh/id_rsa "$TOMCAT_USER@$TOMCAT_HOST" \
          "sudo systemctl stop '$TOMCAT_SERVICE' && \
           if [ -f '$TOMCAT_WEBAPPS/$APP_NAME.war' ]; then \
             sudo cp '$TOMCAT_WEBAPPS/$APP_NAME.war' '$TOMCAT_WEBAPPS/$APP_NAME.war.backup'; \
           fi && \
           sudo install -m 0644 /tmp/$APP_NAME.war '$TOMCAT_WEBAPPS/$APP_NAME.war' && \
           sudo systemctl start '$TOMCAT_SERVICE' && \
           rm -f /tmp/$APP_NAME.war"

  deploy-test:
    name: Deploy TEST
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'TEST' || github.ref == 'refs/heads/test'
    environment:
      name: test
    env:
      TOMCAT_HOST: ${{ vars.TEST_TOMCAT_HOST }}
      TOMCAT_USER: ${{ vars.TEST_TOMCAT_USER }}
      TOMCAT_WEBAPPS: ${{ vars.TEST_TOMCAT_WEBAPPS }}
      TOMCAT_SERVICE: ${{ vars.TEST_TOMCAT_SERVICE }}
      APP_URL: ${{ vars.TEST_APP_URL }}
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
      - name: Copy WAR to TEST
        run: scp -i ~/.ssh/id_rsa ./artifact/*.war "$TOMCAT_USER@$TOMCAT_HOST:/tmp/$APP_NAME.war"
      - name: Deploy TEST
        run: |
          ssh -i ~/.ssh/id_rsa "$TOMCAT_USER@$TOMCAT_HOST" \
          "sudo systemctl stop '$TOMCAT_SERVICE' && \
           if [ -f '$TOMCAT_WEBAPPS/$APP_NAME.war' ]; then \
             sudo cp '$TOMCAT_WEBAPPS/$APP_NAME.war' '$TOMCAT_WEBAPPS/$APP_NAME.war.backup'; \
           fi && \
           sudo install -m 0644 /tmp/$APP_NAME.war '$TOMCAT_WEBAPPS/$APP_NAME.war' && \
           sudo systemctl start '$TOMCAT_SERVICE' && \
           rm -f /tmp/$APP_NAME.war"

  deploy-preprod:
    name: Deploy PRE-PROD
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'PRE-PROD' || github.ref == 'refs/heads/pre-prod'
    environment:
      name: pre-prod
    env:
      TOMCAT_HOST: ${{ vars.PREPROD_TOMCAT_HOST }}
      TOMCAT_USER: ${{ vars.PREPROD_TOMCAT_USER }}
      TOMCAT_WEBAPPS: ${{ vars.PREPROD_TOMCAT_WEBAPPS }}
      TOMCAT_SERVICE: ${{ vars.PREPROD_TOMCAT_SERVICE }}
      APP_URL: ${{ vars.PREPROD_APP_URL }}
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PREPROD_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
      - name: Copy WAR to PRE-PROD
        run: scp -i ~/.ssh/id_rsa ./artifact/*.war "$TOMCAT_USER@$TOMCAT_HOST:/tmp/$APP_NAME.war"
      - name: Deploy PRE-PROD
        run: |
          ssh -i ~/.ssh/id_rsa "$TOMCAT_USER@$TOMCAT_HOST" \
          "sudo systemctl stop '$TOMCAT_SERVICE' && \
           if [ -f '$TOMCAT_WEBAPPS/$APP_NAME.war' ]; then \
             sudo cp '$TOMCAT_WEBAPPS/$APP_NAME.war' '$TOMCAT_WEBAPPS/$APP_NAME.war.backup'; \
           fi && \
           sudo install -m 0644 /tmp/$APP_NAME.war '$TOMCAT_WEBAPPS/$APP_NAME.war' && \
           sudo systemctl start '$TOMCAT_SERVICE' && \
           rm -f /tmp/$APP_NAME.war"

  deploy-prod:
    name: Deploy PROD
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'PROD' || github.ref == 'refs/heads/master'
    environment:
      name: prod
    env:
      TOMCAT_HOST: ${{ vars.PROD_TOMCAT_HOST }}
      TOMCAT_USER: ${{ vars.PROD_TOMCAT_USER }}
      TOMCAT_WEBAPPS: ${{ vars.PROD_TOMCAT_WEBAPPS }}
      TOMCAT_SERVICE: ${{ vars.PROD_TOMCAT_SERVICE }}
      APP_URL: ${{ vars.PROD_APP_URL }}
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
   - name: Copy WAR to PROD
  uses: appleboy/scp-action@v0.1.4
  with:
    host: ${{ env.TOMCAT_HOST }}
    username: ${{ env.TOMCAT_USER }}
    key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
    source: "./artifact/*.war"
    target: "/tmp/${{ env.APP_NAME }}.war"

  




  
